name: Local AV and ONVIF checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  av:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check unchanged AV generation and full offline baseline
        run: |
          python -B av\tools\generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B av\tools\validate.py

  onvif-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify vendored sources, generation, ownership, unit and catalog suites
        run: python -B onvif\tools\validate_onvif.py --suite unit --suite catalog

  onvif-loopback:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Independent loopback wire, event, discovery, Directory, media-unit and integration suites
        run: npm run test:onvif:ci:loopback
      - name: Pack and prove a separate locked installation using public exports
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl)) { throw 'Operator image needs OpenSSL for ephemeral loopback certificates; no binary download is performed.' }
          $env:PATH = (Split-Path -Parent $openssl) + ';' + $env:PATH
          python -B onvif\tools\pack_onvif.py --work-dir (Join-Path $env:TEMP "onvif-package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")

# No native SDK/worker is fetched or executed here. No packages, binaries,
# credentials, traces or qualification logs are uploaded by these workflows.
